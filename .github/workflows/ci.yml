name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - '.idea/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (non-interactive)
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1 || true

          # Pick highest available android platform
          PLAT=""
          for api in 36 35 34 33; do
            if "$SDKMANAGER" --list 2>/dev/null | grep -q "platforms;android-${api}"; then
              PLAT="platforms;android-${api}"
              echo "Found $PLAT"
              break
            fi
          done
          if [ -z "$PLAT" ]; then
            PLAT="platforms;android-35"
            echo "Fallback $PLAT"
          fi

          # NDK candidates
          NDK=""
          for n in "27.2.12479018" "27.0.12077973" "26.3.11579264" "26.1.10909125"; do
            if "$SDKMANAGER" --list 2>/dev/null | grep -q "ndk;${n}"; then
              NDK="ndk;${n}"
              echo "Found $NDK"
              break
            fi
          done
          if [ -z "$NDK" ]; then
            NDK="ndk;27.0.12077973"
            echo "Fallback $NDK"
          fi

          echo "Installing: platform-tools $PLAT build-tools;35.0.0 $NDK cmake;3.22.1"
          "$SDKMANAGER" --install "platform-tools" "$PLAT" "build-tools;35.0.0" "$NDK" "cmake;3.22.1" </dev/null
          echo "SDK packages installed"
          # Keep compileSdk in sync if we picked a lower API
          API_NUM=$(echo "$PLAT" | sed 's/.*android-//')
          echo "PLATFORM_API=$API_NUM" >> "$GITHUB_ENV"
          if [ "$API_NUM" != "35" ]; then
            sed -i "s/compileSdk = 35/compileSdk = ${API_NUM}/; s/targetSdk = 35/targetSdk = ${API_NUM}/" app/build.gradle.kts
            echo "Adjusted compileSdk/targetSdk to $API_NUM"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: List APK outputs
        run: find app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwiftBackupPrem-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwiftBackupPrem-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
