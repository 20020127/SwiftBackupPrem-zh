name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - '.idea/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (non-interactive)
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1 || true

          # Prefer android-37 (required by modern AndroidX); fall back if missing
          PLAT=""
          for api in 37 36 35; do
            if "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-${api}(\s|$)" >/dev/null; then
              PLAT="platforms;android-${api}"
              echo "Found stable $PLAT"
              break
            fi
          done
          if [ -z "$PLAT" ]; then
            # Try preview/canary channel for android-37
            echo "Trying preview channel for android-37..."
            yes | "$SDKMANAGER" --channel=3 --licenses >/tmp/sdk-licenses-preview.log 2>&1 || true
            if "$SDKMANAGER" --channel=3 --list 2>/dev/null | grep -E "platforms;android-37" >/dev/null; then
              PLAT="platforms;android-37"
              echo "Found preview $PLAT"
              "$SDKMANAGER" --channel=3 --install "$PLAT" </dev/null
            fi
          fi
          if [ -z "$PLAT" ]; then
            PLAT="platforms;android-36"
            echo "Fallback $PLAT"
          fi

          NDK=""
          for n in "27.2.12479018" "27.0.12077973" "26.3.11579264"; do
            if "$SDKMANAGER" --list 2>/dev/null | grep -q "ndk;${n}"; then
              NDK="ndk;${n}"
              echo "Found $NDK"
              break
            fi
          done
          if [ -z "$NDK" ]; then NDK="ndk;27.0.12077973"; fi

          echo "Installing: platform-tools $PLAT build-tools;35.0.0 $NDK cmake;3.22.1"
          "$SDKMANAGER" --install "platform-tools" "$PLAT" "build-tools;35.0.0" "$NDK" "cmake;3.22.1" </dev/null
          ls "$ANDROID_HOME/platforms" || true
          echo "SDK packages installed"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK outputs
        if: always()
        run: find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwiftBackupPrem-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
